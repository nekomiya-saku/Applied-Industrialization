name: Build Applied Industrialization

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read mod version
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          test -n "$mod_version"
          echo "MOD_VERSION=$mod_version" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download compile-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/download_dependencies.py

      - name: Build mod JAR
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: applied-industrialization-${{ env.MOD_VERSION }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish JAR release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: Applied Industrialization v${{ env.MOD_VERSION }}
          generate_release_notes: true
          files: build/libs/*-${{ env.MOD_VERSION }}.jar
